name: Build, test, and check learning docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Atlas.slnx
      - name: Build
        run: dotnet build Atlas.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Atlas.slnx --configuration Release --no-build --nologo
      - name: Check learning links
        run: python3 scripts/learn.py check-docs
